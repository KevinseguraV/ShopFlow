# Server
server.port=8087

# Application
spring.application.name=notification-service

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tucorreo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.kafka.consumer.properties.spring.json.value.default.type=com.shopflow.notification_service.event.OrderEvent



# Notificaciones
notification.mail.from=${MAIL_USERNAME:tucorreo@gmail.com}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.shopflow.notification_service=DEBUG
logging.level.org.springframework.kafka=INFO